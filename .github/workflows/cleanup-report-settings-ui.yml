name: Clean report settings UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clean report settings UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/dashboard/reports/page.tsx')
          text = path.read_text()

          text = re.sub(r"\n\s*const htmlSource = templateRow\?\.template_html \?\? ''", "", text, count=1)
          text = re.sub(r"\n\s*<p className=\"muted\">Choose the report form, set the term dates for this school, and select an examination and grade to view the report form\.</p>", "", text, count=1)
          text = re.sub(r"\n\s*<p className=\"muted\">The selected form renders the PDF reports\..*?</p>", "", text, count=1)
          text = re.sub(r"\s*<span className=\"opacity-60\">\(\{currentTermRef\?\.label \?\? 'term'\}\)</span>", "", text)
          text = re.sub(r"\n\s*\{templateKey === 'html_custom' && \(.*?\n\s*\)\}", "", text, count=1, flags=re.S)
          text = re.sub(r"\n\s*<p className=\"muted\" style=\{\{ margin: '0 12px 0 0' \}\}>Reports will show: closes .*?</p>", "", text, count=1)

          text = text.replace(", getEffectiveTermDates, NEXT_TERM_OPENING_PLACEHOLDER", "")
          text = text.replace("import { parseTermReference, getTermRowDates, getEffectiveTermDates, NEXT_TERM_OPENING_PLACEHOLDER } from '@/lib/terms'", "import { parseTermReference, getTermRowDates } from '@/lib/terms'")
          text = text.replace("  const currentClosingDate = effectiveDates.closingDate\n", "")
          text = text.replace("  const nextOpeningDate = effectiveDates.openingDate ?? NEXT_TERM_OPENING_PLACEHOLDER\n", "")
          text = text.replace("    getEffectiveTermDates(supabase, tenantId, currentTermRef),\n", "")
          text = text.replace("  const [termRowDates, effectiveDates] = await Promise.all([", "  const [termRowDates] = await Promise.all([")
          text = text.replace("select('id,name,template_json,template_key,template_html')", "select('id,name,template_json,template_key')")
          text = text.replace("select('id,name,template_json,template_html')", "select('id,name,template_json')")
          text = text.replace("; template_html?: string | null", "")
          text = text.replace("; template_html?: string | null", "")
          text = text.replace("; template_json: unknown; template_html?: string | null", "; template_json: unknown")

          path.write_text(text)
          PY

          grep -nE "Choose the report form|The selected form renders|template_html|html_custom|Reports will show: closes|\(\{currentTermRef" app/dashboard/reports/page.tsx || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/reports/page.tsx
          if git diff --cached --quiet; then
            echo 'No report settings UI changes required.'
            exit 0
          fi
          git commit -m 'fix: simplify report settings and remove custom HTML UI'
          git push
